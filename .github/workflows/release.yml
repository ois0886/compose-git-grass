name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate tag matches library version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          LIB_VERSION=$(grep -oP 'coordinates\("[^"]+",\s*"[^"]+",\s*"\K[^"]+' library/build.gradle.kts)
          if [ "$TAG_VERSION" != "$LIB_VERSION" ]; then
            echo "ERROR: 태그 버전($TAG_VERSION)이 라이브러리 버전($LIB_VERSION)과 불일치"
            exit 1
          fi
          echo "버전 확인 완료: $TAG_VERSION"

      - name: Verify documentation/version sync
        run: ./scripts/verify-doc-sync.sh

      - name: Run library tests
        run: ./gradlew :library:test

      - name: Generate coverage report
        run: ./gradlew :library:jacocoTestReport

      - name: Generate API documentation
        run: ./gradlew :library:dokkaGenerate

      - name: Build library
        run: ./gradlew :library:assembleRelease

      - name: Publish to Maven Central
        run: ./gradlew :library:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            library/build/outputs/aar/*.aar

      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: library/build/dokka/html/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: library/build/reports/jacoco/jacocoTestReport/html/
