name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docs-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify documentation/version sync
        run: ./scripts/verify-doc-sync.sh

  quality:
    runs-on: ubuntu-latest
    needs: [docs-sync]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run library tests
        run: ./gradlew :library:test

      - name: Generate coverage report
        run: ./gradlew :library:jacocoTestReport

      - name: Verify coverage threshold (80%)
        run: ./gradlew :library:jacocoCoverageVerification

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: library/build/reports/jacoco/jacocoTestReport/html/

      - name: Run Android Lint
        run: ./gradlew :library:lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: library/build/reports/lint-results-debug.html

  assemble:
    runs-on: ubuntu-latest
    needs: [docs-sync]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build library
        run: ./gradlew :library:assembleDebug

      - name: Build sample app
        run: ./gradlew :app:assembleDebug

  ui-test:
    runs-on: ubuntu-latest
    needs: [docs-sync]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Compose UI instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew :library:connectedDebugAndroidTest

  build:
    runs-on: ubuntu-latest
    needs: [docs-sync, quality, assemble, ui-test]

    steps:
      - name: CI summary
        run: echo "docs-sync, quality, assemble, ui-test jobs completed"
